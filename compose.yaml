services:
  app:
    build: .
    ports:
      - "8080:8000"   # open http://localhost:8080
    environment:
      # Read from the file .env, which Git ignores. Without it, the app shows demo data.
      LASTFM_API_KEY: ${LASTFM_API_KEY:-}
      LASTFM_USER: ${LASTFM_USER:-}
      DEMO: ${DEMO:-}
      RECENT_TTL: ${RECENT_TTL:-60}
      LASTFM_API_ROOT: ${LASTFM_API_ROOT:-https://ws.audioscrobbler.com/2.0/}
    volumes:
      - music-data:/data   # the last answer, the styles and the covers survive a restart
    restart: unless-stopped

volumes:
  music-data:
