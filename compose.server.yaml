# On the server only, on top of compose.yaml:
#   docker compose -f compose.yaml -f compose.server.yaml up -d --build
#
# The app publishes no port: it joins the Docker network "web", where the shared Caddy
# (repo oscarcaux7/server-proxy) finds it under the name "music-map" and serves it on
# 80 and 443 with HTTPS. Caddy is not in this project, so updating this app never
# restarts it, nor the other apps behind it.
services:
  app:
    ports: !reset []
    restart: unless-stopped
    networks:
      web:
        aliases:
          - music-map

networks:
  web:
    external: true   # created once on the server: docker network create web
